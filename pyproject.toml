[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractal-merge-critic"
version = "0.2.0"
description = "Sequential rate-distortion token coarsening policies for frozen transformers"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
]

[project.optional-dependencies]
research = [
    "transformers>=4.56.2",
    "accelerate>=1.0",
    "datasets>=3.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["merge_critic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
